# Sirve la SPA y reproduce el proxy de vite.config.ts. El DNS de Docker (127.0.0.11) se consulta en cada petición: si el backend se
# recrea y cambia de IP, nginx no se queda apuntando a la vieja ni falla al arrancar sin red hacia acuacar.com.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API. Sin buffer y con lectura larga porque /api incluye el flujo SSE de eventos en vivo.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Para el navegador es el mismo origen: la petición interna al backend no lleva Origin ni necesita CORS.
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 10m;
    }

    # Spring no sirve portadas: este proxy acotado a acuacar.com las trae sin exponer el sitio entero (ADR-038).
    location /acuacar-media/ {
        set $acuacar https://www.acuacar.com;
        rewrite ^/acuacar-media/(.*)$ /wp-content/uploads/$1 break;
        proxy_pass $acuacar;
        proxy_ssl_server_name on;
        proxy_set_header Host www.acuacar.com;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "AguaVigiaCTG-Bot/1.0 (+alertas@aguavigia.com)";
    }

    # Archivos con huella en el nombre: no cambian nunca.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La SPA decide las rutas en el navegador: lo que no es un archivo vuelve a index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

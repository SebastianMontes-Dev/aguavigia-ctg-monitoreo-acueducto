name: Frontend CI

# Solo lee el repositorio: ningun job de este flujo publica, comenta ni escribe (el GITHUB_TOKEN por defecto puede hacerlo todo).
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - "DESIGN.md"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - "DESIGN.md"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Lint, tipos, contrato, pruebas y build
    # Playwright 1.56 no soporta ubuntu-latest (26.04): sin esto «Instalar Chromium» falla antes de correr nada.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tipos (tsc -b)
        run: npm run typecheck

      # Un cambio en backend/openapi.yaml sin `npm run api:sync` deja al cliente tipado contra un contrato viejo.
      - name: Contrato de la API sin deriva
        run: npm run api:check

      # Cada ruta del contrato la llama algún módulo de src o está excluida a propósito (docs/frontend/README.md).
      - name: Cobertura del contrato
        run: npm run api:cobertura

      # tokens.test.ts compara tokens.css con DESIGN.md: por eso DESIGN.md dispara este workflow.
      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (Playwright, sin backend)
        run: npm run test:e2e

      - name: Publicar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 14

  # Por este job el filtro de rutas incluye backend, siembra y compose. El sembrador del compose (ADR-086) no se levanta:
  # las pruebas E2E siembran su propio conjunto controlado en el paso siguiente.
  integracion:
    name: Núcleo ciudadano contra backend real
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/package-lock.json
      - run: node scripts/preparar-env-ci.mjs
      - name: Reservar la ingesta externa durante la prueba de F2
        run: |
          docker compose up -d --wait mongo redis
          docker compose exec -T redis redis-cli SET tarea-unica:ingesta pruebas-f2 EX 3600
      - name: Levantar el backend con el límite de peticiones holgado
        # La siembra pide más de 10 identidades por hora desde una sola IP (el tope real) y recibía un 429.
        env:
          RATE_LIMIT_FACTOR: "100"
          # El flujo de invitación y el del vecino gastan peticiones de /api/cuentas/**, que RATE_LIMIT_FACTOR no mueve.
          RATE_LIMIT_FACTOR_CUENTAS: "10"
        run: docker compose up -d --build --wait mongo redis mailhog backend
      - run: npm ci
        working-directory: scripts
      - name: Sembrar demo y casos de borde
        run: |
          node scripts/sembrar-sectores.mjs
          node scripts/sembrar-demo.mjs
          # La base de este job es desechable: sembrar-demo ya dejo reportes, que las guardas de estos dos scripts tomarian por reales.
          node scripts/sembrar-historico-cortes.mjs --sobre-datos-reales
          node scripts/preparar-pruebas-frontend.mjs --sobre-datos-reales
          docker compose exec -T redis redis-cli EVAL "redis.call('FLUSHDB'); redis.call('SET', 'tarea-unica:ingesta', 'pruebas-f2', 'EX', 3600); return 1" 0
      # Sin PANEL_CORREO y PANEL_CLAVE las pruebas e2e del panel se omiten. No hace falta ningún secreto: el backend genera la clave del
      # ADMIN inicial al arrancar y la escribe en su log una sola vez (ADR-086); el correo es el de preparar-env-ci.mjs.
      - name: Leer la clave del ADMIN inicial del log del backend
        run: |
          clave=$(docker compose logs backend | grep -o 'ADMINISTRADOR INICIAL[^"]*' | sed -n 's/.*clave: \([^ ]*\) | .*/\1/p' | head -1)
          test -n "$clave" || { echo "::error::No se encontró la clave del ADMIN inicial en el log del backend"; exit 1; }
          echo "::add-mask::$clave"
          echo "PANEL_CORREO=admin@example.test" >> "$GITHUB_ENV"
          echo "PANEL_CLAVE=$clave" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E reales de mapa, reportes y avisos con Mailhog
        run: npm run test:e2e:real
        working-directory: frontend
      - name: Conservar trazas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nucleo-ciudadano-backend-real
          path: frontend/test-results/
          retention-days: 14
      - name: Detener entorno efímero
        if: always()
        run: docker compose down -v

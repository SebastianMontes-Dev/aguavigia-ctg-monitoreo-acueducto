<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{titulo}}</title>
<!-- Aviso de un cambio en la cuenta, sin enlace. La misma composición que cuenta-con-enlace.html (ADR-114). -->
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  @media only screen and (max-width: 620px) {
    .marco   { width: 100% !important; }
    .relleno { padding-left: 24px !important; padding-right: 24px !important; }
    .titular { font-size: 24px !important; line-height: 30px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .fondo   { background-color: #111719 !important; }
    .tarjeta { background-color: #1a1f22 !important; border-color: #354044 !important; }
    .marca   { color: #8cc8b8 !important; }
    .tinta   { color: #f1f4f2 !important; }
    .tinta-2 { color: #b1bbbd !important; }
  }
</style>
</head>

<body class="fondo" style="margin:0; padding:0; background-color:#f5f5f2; -webkit-font-smoothing:antialiased;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="fondo" style="background-color:#f5f5f2;">
    <tr>
      <td align="center" style="padding:40px 12px;">

        <table role="presentation" class="marco" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; max-width:560px;">

          <tr>
            <td class="relleno" style="padding:0 40px 20px;">
              <p class="marca" style="margin:0; font-family:'Newsreader',Georgia,'Times New Roman',serif; font-size:20px; line-height:26px; font-weight:500; color:#2f5f57;">
                AguaVigía · Cartagena
              </p>
            </td>
          </tr>

          <tr>
            <td>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="tarjeta" style="background-color:#ffffff; border:1px solid #dddcd6; border-radius:12px;">
                <tr>
                  <td class="relleno" style="padding:40px 40px 0;">
                    <h1 class="titular tinta" style="margin:0; font-family:'Newsreader',Georgia,'Times New Roman',serif; font-size:26px; line-height:32px; font-weight:400; color:#15191c;">
                      {{titulo}}
                    </h1>
                  </td>
                </tr>
                <tr>
                  <td class="relleno" style="padding:20px 40px 40px;">
                    <p class="tinta" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:16px; line-height:26px; color:#15191c;">
                      Hola, {{nombre}}.
                    </p>
                    <p class="tinta-2" style="margin:12px 0 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:16px; line-height:26px; color:#4a5157;">
                      {{mensaje}}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="relleno" style="padding:20px 40px 0;">
              <p class="tinta-2" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:12px; line-height:19px; color:#4a5157;">
                Es un aviso automático sobre tu cuenta. No hace falta que respondas.
              </p>
              <p class="tinta-2" style="margin:6px 0 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:12px; line-height:19px; color:#4a5157;">
                AguaVigía CTG · Monitoreo ciudadano del acueducto de Cartagena de Indias
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
